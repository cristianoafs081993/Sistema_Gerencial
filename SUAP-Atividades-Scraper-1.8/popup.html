<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SUAP Atividades Scraper</title>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      width: 380px;
      padding: 16px;
      background-color: #f8fafc;
      margin: 0;
      color: #0f172a;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #1e293b;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #1e293b;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 5px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      transition: background-color 0.2s;
      font-weight: 500;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .secondary {
      background-color: #475569;
    }
    .secondary:hover {
      background-color: #334155;
    }
    .auth-card {
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: #eff6ff;
    }
    .auth-card button:last-of-type {
      margin-bottom: 0;
    }
    #extension-auth-status {
      margin: 8px 0 0;
      font-size: 12px;
      color: #334155;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #475569;
      max-height: 150px;
      overflow-y: auto;
      padding: 8px;
      background: white;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      display: none;
      word-wrap: break-word;
    }
    .status-line { margin-bottom: 4px; }
    .status-error { color: #ef4444; }
    .status-success { color: #10b981; }
    .status-info { color: #3b82f6; }
  </style>
</head>
<body>
  <h2>SUAP Scraper</h2>
  <section class="auth-card" aria-labelledby="extension-auth-title">
    <h3 id="extension-auth-title">Acesso ao banco de dados</h3>
    <label>
      E-mail do SIAGES
      <input id="extension-auth-email" type="email" autocomplete="username">
    </label>
    <label>
      Senha do SIAGES
      <input id="extension-auth-password" type="password" autocomplete="current-password">
    </label>
    <button id="btn-extension-sign-in" type="button">Entrar no banco</button>
    <button id="btn-extension-sign-out" type="button" class="secondary">Sair do banco</button>
    <p id="extension-auth-status" aria-live="polite">A extensão consulta o banco com as permissões do seu usuário.</p>
  </section>
  <label>
    URL do SIAGES
    <input id="siages-app-origin" type="url" inputmode="url" placeholder="https://www.siages.com.br">
  </label>
  <button id="btn-save-siages-origin" class="secondary">Salvar URL do SIAGES</button>
  <label>
    Segredo de automação
    <input id="automation-secret" type="password" autocomplete="off" placeholder="AUTOMATION_EVENT_SECRET">
  </label>
  <button id="btn-extract-en">Extrair Dimensão (EN - Ensino)</button>
  <button id="btn-extract-all" class="secondary">Extrair Todas as Dimensões</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
